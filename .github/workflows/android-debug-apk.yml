name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: RStudioApp
          cache-encryption-key: ${{ runner.os }}-gradle-android-${{ github.sha }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
        working-directory: RStudioApp

      - name: Run unit tests
        run: ./gradlew --stacktrace :app:testDebugUnitTest
        working-directory: RStudioApp

      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug
        working-directory: RStudioApp

      - name: Verify APK output
        run: |
          test -s build_output/app-debug.apk
          ls -lh build_output/app-debug.apk
        working-directory: RStudioApp

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RStudioApp-debug-apk
          path: RStudioApp/build_output/app-debug.apk
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
